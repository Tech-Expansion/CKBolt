# Checks every push and pull request: types, the production build (what Vercel runs, from a clean checkout, so a file
# the build needs but git ignores fails here first), then the unit tests against the test build. The e2e suites need a
# browser with Document-Isolation-Policy (real Chrome) and stay a local step (README.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Test build and unit tests
        run: |
          npm run build:test
          npx playwright test --project=unit
