# fnn v0.9.1 config of fnn-hub (the hub's Fiber node) on CKB testnet. It is the bundled config/testnet/config.yml of
# fnn v0.9.1 (bootnodes, Fiber scripts, RUSD whitelist) with the `pubsub` RPC module added for the hub (FIBER_PUBSUB=true),
# a cWBTC whitelist entry (CCH Wrapped BTC, the hub's FIBER_ASSETS CWBTC), and WITHOUT any `auto_accept_amount`: an entry
# without it is never auto-accepted (fnn is_udt_type_auto_accept), so nobody can open RUSD or cWBTC channels to the hub.
# demo.yml is the same file with auto-accept kept for fnn-demo; keep both in step. fnn reads this file only at start:
# restart fnn-hub after changing the whitelist (`docker compose restart fnn-hub`). Per-node values come from the environment in docker-compose.yml (RPC_LISTENING_ADDR, FIBER_ANNOUNCED_*,
# FIBER_AUTO_ACCEPT_CHANNEL_CKB_FUNDING_AMOUNT, CKB_NODE_RPC_URL), which override this file. Do not edit the `scripts`
# section: it is fixed by the Fiber deployment on testnet.

fiber:
  listening_addr: "/ip4/0.0.0.0/tcp/8228"
  bootnode_addrs:
    - "/ip4/54.179.226.154/tcp/8228/p2p/Qmes1EBD4yNo9Ywkfe6eRw9tG1nVNGLDmMud1xJMsoYFKy"
    - "/ip4/16.163.7.105/tcp/8228/p2p/QmdyQWjPtbK4NWWsvy8s69NGJaQULwgeQDT5ZpNDrTNaeV"
  announce_listening_addr: true
  chain: testnet
  # https://github.com/nervosnetwork/fiber-scripts/blob/main/deployment/testnet/migrations/2025-02-28-111246.json
  scripts:
    - name: FundingLock
      script:
        code_hash: 0x6c67887fe201ee0c7853f1682c0b77c0e6214044c156c7558269390a8afa6d7c
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x3cb7c0304fe53f75bb5727e2484d0beae4bd99d979813c6fc97c3cca569f10f6
        - cell_dep:
            out_point:
              tx_hash: 0x12c569a258dd9c5bd99f632bb8314b1263b90921ba31496467580d6b79dd14a7 # ckb_auth
              index: 0x0
            dep_type: code
    - name: CommitmentLock
      script:
        code_hash: 0x740dee83f87c6f309824d8fd3fbdd3c8380ee6fc9acc90b1a748438afcdf81d8
        hash_type: type
        args: 0x
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0xf7e458887495cf70dd30d1543cad47dc1dfe9d874177bf19291e4db478d5751b
        - cell_dep:
            out_point:
              tx_hash: 0x12c569a258dd9c5bd99f632bb8314b1263b90921ba31496467580d6b79dd14a7 # ckb_auth
              index: 0x0
            dep_type: code

rpc:
  # Overridden per node by RPC_LISTENING_ADDR (the compose hostname, a private address: no Biscuit key needed).
  listening_addr: "127.0.0.1:8227"
  # pubsub enables the subscribe_store_changes WebSocket the hub listens to (FIBER_PUBSUB in hub.env).
  enabled_modules:
    - channel
    - graph
    - info
    - invoice
    - payment
    - peer
    - pubsub

ckb:
  # Overridden by CKB_NODE_RPC_URL (CKB_RPC_URL in .env).
  rpc_url: "https://testnet.ckbapp.dev/"
  udt_whitelist:
    # Generated from the hub's FIBER_ASSETS (docs/add-token.md): change FIBER_ASSETS and generate again, not this list.
    - name: RUSD
      script:
        code_hash: 0x1142755a044bf2ee358cba9f2da187ce928c91cd4dc8692ded0337efa677d21a
        hash_type: type
        # fnn matches args as an unanchored regex: the anchors keep the entry to this one token.
        args: "^0x878fcc6f1f08d48e87bb1c3b3d5083f23f8a39c5d5c764f253b55b998526439b$"
      cell_deps:
        - type_id:
            code_hash: 0x00000000000000000000000000000000000000000000000000545950455f4944
            hash_type: type
            args: 0x97d30b723c0b2c66e9cb8d4d0df4ab5d7222cbb00d4a9a2055ce2e5d7f0d8b0f
    - name: cWBTC
      script:
        code_hash: 0x25c29dc317811a6f6f3985a7a9ebc4838bd388d19d0feeecf0bcd60f6c0975bb
        hash_type: type
        # fnn matches args as an unanchored regex: the anchors keep the entry to this one token.
        args: "^0x9a1086531ed6dc69e0bd44cef5278e03faf3015b31aff60b08fb87663ce8507100000000$"
      cell_deps:
        - cell_dep:
            out_point:
              tx_hash: 0xbf6fb538763efec2a70a6a3dcb7242787087e1030c4e7d86585bc63a9d337f5f
              index: 0x0
            dep_type: code
      # Accepts on its own a channel a node opens to the hub with 0.1 cWBTC or more (FIBER_ASSETS peerChannels.minAmount).
      auto_accept_amount: 10000000

services:
  - fiber
  - rpc
  - ckb
